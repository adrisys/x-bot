apiVersion: v1
kind: ConfigMap
metadata:
  name: x-bot-config
  namespace: x-bot
data:
  # LLM provider: "openai", "anthropic", or "grok"
  LLM_PROVIDER: "openai"
  # Model override (optional — defaults are set per provider)
  # LLM_MODEL: "gpt-4o"

  # 4 tweets/day (every ~6h with ±15% jitter)
  POST_INTERVAL_HOURS: "6"

  TOPICS: >-
    bitcoin,BTC,cardano,ADA,Charles Hoskinson,crypto,DeFi,web3,
    investing,Naval Ravikant,wealth creation,passive income,
    libertarian,sovereignty,Milei,Austrian economics,free market,anarcocapitalismo,
    política española,España,VOX,Abascal,impuestos,soberanía

  PERSONA: >-
    You are writing from an X account. Your style is sharp, contrarian, and concise.
    You think in first principles and add a unique insight or reframe — you never just agree.
    You write in either English or Spanish, but never mix both in the same tweet.
    Be quotable. No hashtags, no emojis unless truly fitting.
    Sound like a real person, not a bot.

  # Set to "true" to log tweets without posting them
  DRY_RUN: "false"

  # Trend-driven posting (free sources: RSS / HN / CoinGecko, no API keys).
  USE_TRENDS: "true"
  # RSS feeds as comma-separated label|url pairs. Google News search feeds cover
  # the Spanish-language angles (Milei/Argentina, España); Mises and
  # Cointelegraph cover Austrian economics and crypto. Each label is its own
  # source family, so airtime stays balanced across feeds.
  TREND_RSS_FEEDS: "google-news-ar|https://news.google.com/rss/search?q=Milei&hl=es-419&gl=AR&ceid=AR:es-419,google-news-es|https://news.google.com/rss/search?q=Espa%C3%B1a&hl=es&gl=ES&ceid=ES:es,mises|https://mises.org/rss.xml,cointelegraph|https://cointelegraph.com/rss"
  TREND_INCLUDE_HN: "true"
  TREND_INCLUDE_CRYPTO: "true"
  # Minimum score (RSS feed-position score / HN points / CoinGecko derived score)
  # to qualify; if nothing qualifies the bot falls back to the static TOPICS list.
  TREND_MIN_SCORE: "50"
